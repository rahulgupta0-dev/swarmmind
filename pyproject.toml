[project]
name = "swarmmind"
version = "0.2.0"
description = "Multi-agent research orchestration platform powered by AMD Lemonade"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lemonade SwarmMind Team" },
]
keywords = ["amd", "lemonade", "rag", "multi-agent", "research", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "markitdown[all]>=0.1.6",
    "chromadb>=0.5.0",
    "duckduckgo-search>=7.0.0",
    "streamlit>=1.35.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "aiosqlite>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/rahulgupta0-dev/swarmmind"
Repository = "https://github.com/rahulgupta0-dev/swarmmind.git"
Documentation = "https://github.com/rahulgupta0-dev/swarmmind#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
swarmmind = "swarmmind.cli.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarmmind*"]
